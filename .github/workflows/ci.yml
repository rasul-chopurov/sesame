name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Screenshots
        run: cargo test -p sesame-app --test screenshots --locked
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: cargo build -p sesame-app --locked
      - name: Test the engine (no GUI)
        run: cargo test --locked -p sesame-core -p sesame-cloudflare -p sesame-mail -p sesame-update -p sesame-engine
