name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Screenshots
        run: cargo test -p sesame-app --test screenshots --locked
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        shell: bash
        run: |
          set -o pipefail
          cargo build -p sesame-app --locked --color never 2>&1 | tee build.log || {
            # Surface compiler errors as annotations (readable without signing in).
            msg=$({ grep -E -A12 '^(error|warning: build failed)' build.log | head -90; echo '--- tail:'; tail -20 build.log; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
            exit 1
          }
      - name: Test the engine (no GUI)
        run: cargo test --locked -p sesame-core -p sesame-cloudflare -p sesame-mail -p sesame-update -p sesame-engine
