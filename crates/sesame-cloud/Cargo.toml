[package]
name = "sesame-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted Sesame for teams: a web app and API on top of the same engine, with roles and approvals."

[[bin]]
name = "sesame-cloud"
path = "src/main.rs"

[dependencies]
sesame-core = { path = "../sesame-core" }
sesame-engine = { path = "../sesame-engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
sesame-ssh = { path = "../sesame-ssh" }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = "0.6"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
