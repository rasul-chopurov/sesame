[package]
name = "sesame-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sesame — open your servers. A native, AI-friendly server manager for the Laravel community."

[[bin]]
name = "sesame"
path = "src/main.rs"

[dependencies]
sesame-core = { path = "../sesame-core" }
sesame-ssh = { path = "../sesame-ssh" }
sesame-discovery = { path = "../sesame-discovery" }
sesame-update = { path = "../sesame-update" }
sesame-ops = { path = "../sesame-ops" }
sesame-provision = { path = "../sesame-provision" }
sesame-github = { path = "../sesame-github" }
sesame-cloudflare = { path = "../sesame-cloudflare" }
gpui-kit.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
rust-i18n = "4"
rpassword = "7"
vt100 = "0.18"
sesame-engine = { path = "../sesame-engine" }
axum = "0.8"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
sys-locale = "0.3"
semver = "1"
time = "0.3"

[dev-dependencies]
serde_json.workspace = true
sesame-ops = { path = "../sesame-ops" }
sesame-provision = { path = "../sesame-provision" }
gpui-kit = { workspace = true, features = ["test-support"] }
sesame-discovery = { path = "../sesame-discovery" }
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "screenshots"
harness = false
